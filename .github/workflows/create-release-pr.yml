name: Create release PR

# Humans start a release here: run this workflow (Actions → Create release
# PR → Run workflow), pick the version bump, and review the PR it opens.
# Merging that PR into trunk changes the plugin version, which triggers the
# Release workflow to build and publish the plugin zip.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # bin/release.mjs bumps the version (package.json, plugin header,
      # version constant, n.e.x.t placeholders), turns the changelog's
      # Unreleased section into the version's section (hand-written
      # highlights, then every commit since the last v* tag linked to its
      # PR — which is why the checkout above needs the full history and
      # tags), and commits on a release/vX.Y.Z branch.
      - name: Run release script
        id: release
        run: |
          npm run release -- "${{ inputs.release_type }}"

          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v${VERSION}"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        run: >
          git push --set-upstream origin
          "${{ steps.release.outputs.branch }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-pr-body.md <<'BODY'
          Prepares v${{ steps.release.outputs.version }} for review.

          Release type: ${{ inputs.release_type }}
          Generated by: Create release PR workflow

          Merging this PR into trunk starts the Release workflow, which
          builds the self-contained plugin zip (bundled Gutenberg included)
          and publishes a GitHub release.
          BODY

          gh pr create \
            --base trunk \
            --head "${{ steps.release.outputs.branch }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --body-file release-pr-body.md
