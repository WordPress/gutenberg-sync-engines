name: Release

# Publishes a GitHub release whenever the plugin version changes on trunk
# (normally by merging the PR the "Create release PR" workflow opens). The
# release asset is gutenberg-sync-engines.zip: a self-contained plugin that
# bundles the pinned, built Gutenberg framework, ready to install on any
# WordPress site.

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  check_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version_check
        run: |
          OLD_VERSION=$(git show HEAD^:gutenberg-sync-engines.php 2>/dev/null | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          NEW_VERSION=$(git show HEAD:gutenberg-sync-engines.php | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "No version change detected"
            exit 0
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version changed from $OLD_VERSION to $NEW_VERSION"

      - name: Setup Node
        if: steps.version_check.outputs.new_version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        if: steps.version_check.outputs.new_version
        run: npm ci

      # The vendored Gutenberg subtree is committed source-only; the release
      # zip bundles its BUILT plugin. --ignore-scripts skips the subtree's
      # husky prepare hook (it errors outside a git root); the lifecycle
      # outputs it also skips are regenerated by `npm run build`.
      - name: Install and build the vendored Gutenberg subtree
        if: steps.version_check.outputs.new_version
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      # bin/build-plugin-zip.sh builds the plugin bundle and stages the
      # plugin plus the bundled Gutenberg into gutenberg-sync-engines.zip.
      - name: Build plugin zip
        if: steps.version_check.outputs.new_version
        run: npm run plugin-zip

      - name: Create Release
        if: steps.version_check.outputs.new_version
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          files: gutenberg-sync-engines.zip
          generate_release_notes: true
