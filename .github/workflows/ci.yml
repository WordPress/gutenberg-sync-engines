name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, Jest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      # Jest and typecheck resolve @wordpress/sync + yjs from the vendored
      # subtree, which is committed source-only. --ignore-scripts skips the
      # subtree's husky prepare hook (it errors outside a git root); the
      # lifecycle outputs it also skips are regenerated by `npm run build`.
      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      # PHP lint (composer lint) runs in the php job, where Composer is
      # already installed. The debt was burned down to zero (V1 item A6);
      # the lint step keeps it there.
      - name: Lint
        run: npm run lint:js

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm run test:js

      # The collaboration review-panel components (V1 item B3) live in the
      # vendored subtree, outside the plugin Jest's roots — run their own
      # suite so the card/panel lifecycle stays certified.
      - name: Subtree component Jest (collaboration-review-panel)
        run: |
          cd gutenberg
          npm run test:unit -- collaboration-review-panel

      - name: Build the plugin bundle
        run: npm run build

  php:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      # An UNBUILT gutenberg.php refuses to load its lib/ (the framework),
      # so the plugin under test finds no WP_Sync_* contracts and the
      # PHPUnit bootstrap dies with "Interface WP_Sync_Engine not found".
      # The subtree build is required even for the PHP-only test path.
      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      # phpcs and the y-php conformance suite run on the runner's PHP
      # directly (no WordPress). The automerge-php suite does NOT — see
      # its step below.
      - name: Set up PHP for phpcs and y-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress

      # Zero errors, zero warnings since the A6 burn-down; this step keeps
      # the standards debt from silently re-accumulating.
      - name: PHP lint (phpcs)
        run: composer lint

      # The vendored y-php library's own conformance suite: translated
      # upstream Yjs tests plus byte-level fixtures generated from the JS
      # implementation.
      - name: y-php conformance
        run: |
          composer --working-dir=includes/lib/y-php install --no-progress
          composer --working-dir=includes/lib/y-php test

      # The vendored automerge-php library's own conformance suite:
      # ported upstream Automerge JS/Rust tests (680 mapped). Needs no
      # Composer install (hand-rolled runner). The runner exits non-zero
      # on any failing test; keep its report visible either way.
      #
      # It runs in the official php image, NOT on setup-php's PHP. Its
      # grapheme-cluster paths need the fixed GB11 rules of PCRE2 >= 10.43,
      # and that is a property of the PCRE2 library PHP links, not of the
      # PHP version: PHP 8.4 bundles 10.44, but distro-style builds link
      # the system libpcre2 — 10.42 on Ubuntu 24.04 — and setup-php's
      # Ubuntu packages started doing exactly that on 2026-09-03 (same
      # PHP 8.4.25, two tests newly failing: two adjacent emoji-ZWJ
      # sequences counted as ONE \X cluster). The official image is built
      # against the bundled PCRE2. The guard turns any regression of that
      # assumption into a message naming the cause instead of two cryptic
      # test failures.
      - name: automerge-php conformance
        env:
          PHP_IMAGE: php:8.4-cli
        run: |
          docker run --rm "$PHP_IMAGE" php -r '
            $pcre = PCRE_VERSION_MAJOR . "." . PCRE_VERSION_MINOR;
            printf( "PHP %s, PCRE2 %s, mbstring %s\n", PHP_VERSION, PCRE_VERSION, extension_loaded( "mbstring" ) ? "on" : "OFF" );
            if ( version_compare( $pcre, "10.43", "<" ) || ! extension_loaded( "mbstring" ) ) {
              echo "automerge-php conformance needs PCRE2 >= 10.43 (GB11 grapheme rules) and mbstring; pick an image whose PHP is built against the bundled PCRE2.\n";
              exit( 1 );
            }
          '
          status=0
          docker run --rm -v "$PWD:/app" -w /app "$PHP_IMAGE" \
            php includes/lib/automerge-php/tests/run.php > automerge-conformance.json || status=$?
          php -r '
            $report = json_decode( (string) file_get_contents( "automerge-conformance.json" ), true );
            if ( ! is_array( $report ) ) {
              echo "Runner produced no JSON report:\n";
              echo file_get_contents( "automerge-conformance.json" ), "\n";
              exit( 1 );
            }
            printf( "passing=%d failing=%d (%s%%)\n", $report["passingTests"] ?? -1, $report["failingTests"] ?? -1, $report["passPercent"] ?? "?" );
          '
          if [ "$status" -ne 0 ]; then
            echo "=== failing tests ==="
            grep -B 8 '"passed": false' automerge-conformance.json || true
          fi
          exit "$status"

      # Tests target the dedicated tests environment (.wp-env.tests.json)
      # — the default .wp-env.json is the dev environment, whose afterStart
      # hook (the websocket daemon) has no business in CI.
      - name: Start wp-env (tests)
        run: npm run env:tests start

      - name: PHPUnit
        run: npm run test:php

  bench:
    name: Benchmark invariants (certify sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      - name: Build the plugin bundle
        run: npm run build

      - name: Start wp-env (tests)
        run: npm run env:tests start

      - name: Certify sweep
        run: npm run bench -- --certify=3

  # One job per engine, run side by side. Each engine's specs carry an
  # `@engine-<slug>` tag; RTC_E2E_ENGINE picks one slice (see
  # tests/e2e/playwright.config.ts). The `none` slice runs the specs that
  # belong to no engine, so the four slices together are the whole suite.
  e2e:
    name: End-to-end (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One engine failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - engine: intent-log
            label: intent-log
          - engine: yjs-server
            label: yjs-server
          - engine: de-rtc
            label: de-rtc
          - engine: none
            label: engine-neutral
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      - name: Build the plugin bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start wp-env (tests)
        run: npm run env:tests start

      # The @wordpress/scripts base config applies 2 retries under CI,
      # which absorbs the suite's known under-load flake (a fixture login
      # navigation can time out in a full run; every spec is green solo —
      # see AGENTS.md).
      - name: Playwright
        env:
          RTC_E2E_ENGINE: ${{ matrix.engine }}
        run: npm run test:e2e

      # cancelled() covers timed-out runs, where we also want artifacts
      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.label }}-artifacts
          path: artifacts/
          retention-days: 7

  e2e-websocket:
    name: End-to-end websocket (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      - name: Build the plugin bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start wp-env (tests)
        run: npm run env:tests start

      # The websocket-only suite runs against the plugin's REAL websocket
      # transport: the launcher publishes the `wp collaboration
      # sync-server` daemon from the tests env's cli image on host port
      # 8787 and restores the site's transport at teardown (V1 item A3 —
      # this lane is what de-experimentalizes the websocket transport).
      - name: Playwright (websocket-only)
        run: npm run test:e2e:websocket

      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-websocket-artifacts
          path: artifacts/
          retention-days: 7

  e2e-sse:
    name: End-to-end server-sent events (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      - name: Build the plugin bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The tests config's afterStart hook starts Redis beside the site.
      - name: Start wp-env (tests)
        run: npm run env:tests start

      # The sse-only suite selects the SSE transport on the tests site for
      # its duration (global setup) and restores the previous one after
      # (global teardown); it refuses to start without the Redis container.
      - name: Playwright (sse-only)
        run: npm run test:e2e:sse

      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sse-artifacts
          path: artifacts/
          retention-days: 7
