name: Set up the plugin and the built Gutenberg copy
description: >
  Installs the plugin's npm dependencies and the built Gutenberg subtree,
  restoring each from the cache when nothing it depends on has changed.
  Optionally installs the Playwright browser the same way.

inputs:
  playwright:
    description: Also install the Playwright Chromium browser.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # The whole node_modules folder, not npm's download cache: a hit skips
    # `npm ci` entirely.
    - name: Restore plugin dependencies
      id: plugin-deps
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install plugin dependencies
      if: steps.plugin-deps.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # The subtree's git tree ID changes exactly when its source does, so it
    # keys the build outputs. Only the built files are cached, not the
    # subtree's node_modules: PHP and the browser need nothing else, and
    # without that folder the e2e fixtures resolve @playwright/test and
    # @wordpress/e2e-test-utils-playwright from the plugin's own copies.
    - name: Read the Gutenberg subtree's tree ID
      id: subtree
      shell: bash
      run: echo "tree=$(git rev-parse HEAD:gutenberg)" >> "$GITHUB_OUTPUT"

    - name: Restore the built Gutenberg subtree
      id: subtree-build
      uses: actions/cache@v4
      with:
        path: |
          gutenberg/build
          gutenberg/packages/*/build
          gutenberg/packages/*/build-module
          gutenberg/packages/*/build-style
        key: gutenberg-build-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ steps.subtree.outputs.tree }}

    # --ignore-scripts skips the subtree's husky prepare hook (it errors
    # outside a git root); `npm run build` regenerates what it also skips.
    - name: Install and build the vendored Gutenberg subtree
      if: steps.subtree-build.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd gutenberg
        npm ci --ignore-scripts
        npm run build

    - name: Read the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the Playwright browser
      if: inputs.playwright == 'true'
      id: playwright-browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # No --with-deps: the runner image already has the libraries Chromium
    # needs, and the apt step that flag adds (mostly fonts) once took ten
    # minutes on a slow mirror.
    - name: Install Playwright browser
      if: inputs.playwright == 'true' && steps.playwright-browser.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium
