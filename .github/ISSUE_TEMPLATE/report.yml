name: Report a problem or suggest an idea
description: For humans. Say what happened in your own words and an agent will work out the technical detail.
labels: [ "agent:needs shaping" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Please write this the way you would describe
        it to a colleague. You do not need to know how the code works,
        and you do not need to use our words for things.

        If something is broken, the most useful thing you can give us is
        the steps you took just before it happened.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What did you see? If you are suggesting an idea rather than
        reporting a problem, describe what you cannot do today.
      placeholder: >-
        I was editing a post with a colleague. I typed a sentence into a
        table and the letters came out jumbled on my screen, but my
        colleague's screen looked fine.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect instead?
      placeholder: The text should appear the way I typed it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: >-
        Steps if you have them. A rough sequence is far better than
        nothing, and "it only happens sometimes" is useful to know.
      placeholder: |
        1. Open the same post in two windows as two different people.
        2. Both start typing at once.
        3. Type quickly inside a table cell.
    validations:
      required: false

  - type: dropdown
    id: engine
    attributes:
      label: Which engine were you using?
      description: >-
        Settings → Collaboration shows this. Pick "not sure" if you did
        not change it.
      options:
        - Not sure
        - intent-log
        - yjs-server
        - It happens on more than one
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: >-
        Screenshots, how often it happens, whether a reload fixed it,
        anything that seemed relevant.
    validations:
      required: false
